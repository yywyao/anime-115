services:
  app:
    build: .
    restart: unless-stopped
    stop_grace_period: 90s
    user: "${APP_UID:-10001}:${APP_GID:-10001}"
    environment:
      MIKAN_HOST: 0.0.0.0
      MIKAN_PORT: 8788
      MIKAN_DATA_DIR: /app/data
      MIKAN_SETUP_TOKEN: "${MIKAN_SETUP_TOKEN:?Run python3 tools/configure.py first}"
      MIKAN_SECURE_COOKIE: "${MIKAN_SECURE_COOKIE:-0}"
      ALIST_URL: http://alist:5244
      ALIST_USERNAME: admin
      ALIST_MANAGED: "1"
      ALIST_PASSWORD: "${ALIST_PASSWORD:?Run python3 tools/configure.py first}"
      MIKAN_URL: "${MIKAN_URL:-https://mikanani.me}"
      SONARR_MANAGED: "1"
      SONARR_URL: http://sonarr:8989
      SONARR_API_VERSION: v3
    ports:
      - "127.0.0.1:${MIKAN_PORT:-8788}:8788"
    volumes:
      - ./runtime/app:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      - alist
      - sonarr
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8788/api/health', timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 3
  alist:
    image: xhofe/alist:v3.66.0-ffmpeg
    restart: unless-stopped
    environment:
      ALIST_PASSWORD: "${ALIST_PASSWORD:?Run python3 tools/configure.py first}"
    entrypoint: ["/bin/sh", "/mikan115-alist-start.sh"]
    tmpfs:
      - /opt/alist/data:mode=0700
    volumes:
      - ./deploy/alist-start.sh:/mikan115-alist-start.sh:ro
    security_opt:
      - no-new-privileges:true
  sonarr:
    image: lscr.io/linuxserver/sonarr@sha256:339814bbf50599ac3b59077c252f29833d0138b59a062d0e82ce37bdc7f04f86
    restart: unless-stopped
    environment:
      PUID: "${APP_UID:-10001}"
      PGID: "${APP_GID:-10001}"
      TZ: "${TZ:-Asia/Shanghai}"
      MIKAN_SONARR_SECRET: "${ALIST_PASSWORD:-}"
    entrypoint: ["/bin/sh", "/mikan115-sonarr-start.sh"]
    volumes:
      - ./deploy/sonarr-start.sh:/mikan115-sonarr-start.sh:ro
    tmpfs:
      - /config:mode=0700
    security_opt:
      - no-new-privileges:true
