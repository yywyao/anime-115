services:
  app:
    build: .
    restart: unless-stopped
    user: "${APP_UID:-10001}:${APP_GID:-10001}"
    environment:
      MIKAN_HOST: 0.0.0.0
      MIKAN_PORT: 8788
      MIKAN_DATA_DIR: /app/data
      MIKAN_SETUP_TOKEN: "${MIKAN_SETUP_TOKEN:?Run python3 tools/configure.py first}"
      MIKAN_SECURE_COOKIE: "${MIKAN_SECURE_COOKIE:-0}"
      ALIST_URL: http://alist:5244
      ALIST_USERNAME: admin
      ALIST_PASSWORD: "${ALIST_PASSWORD:?Run python3 tools/configure.py first}"
      MIKAN_URL: "${MIKAN_URL:-https://mikanani.me}"
    ports:
      - "127.0.0.1:${MIKAN_PORT:-8788}:8788"
    volumes:
      - ./runtime/app:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      - alist
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8788/api/health', timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 3
  alist:
    image: xhofe/alist:v3.66.0-ffmpeg
    restart: unless-stopped
    environment:
      ALIST_PASSWORD: "${ALIST_PASSWORD:?Run python3 tools/configure.py first}"
    entrypoint: ["/bin/sh", "/mikan115-alist-start.sh"]
    volumes:
      - ./runtime/alist:/opt/alist/data
      - ./deploy/alist-start.sh:/mikan115-alist-start.sh:ro
    ports:
      - "127.0.0.1:${ALIST_PORT:-5244}:5244"
    security_opt:
      - no-new-privileges:true
